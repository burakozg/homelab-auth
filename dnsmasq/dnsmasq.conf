# Local DNS override for the homelab-auth project — see ../README.md.
#
# The single job this serves: every name under the shared internal domain
# (HOMELAB_DOMAIN in .deploy.env) that a browser looks up must resolve to
# Traefik's address, so the session cookie homelab-auth issues
# (Domain=.<HOMELAB_DOMAIN>) is sent to every gated app — a cookie cannot
# cross different IP-address origins the way it crosses subdomains of one
# real domain, which is the whole reason this container exists.
#
# Everything else must keep working exactly as it did before this was
# deployed: any device that gets this container handed to it as a DNS server
# (via the router's DHCP override) still needs the rest of the internet to
# resolve normally.

# Don't read /etc/resolv.conf inside the container — the upstream resolver is
# named explicitly below instead, so behavior doesn't depend on whatever the
# base image ships in that file.
no-resolv

# Forward anything not matched below to the LAN gateway, which runs its own
# resolver. Filled in by ./deploy render from .deploy.env, the same way
# every other project fills in its LAN address — see ../deploy.
server=UPSTREAM_DNS_PLACEHOLDER

# Every name under the shared domain — auth, and every app gated behind it —
# is one Traefik address. Traefik tells apps apart by the Host header, not by
# IP, so one record covers all of them; adding a sixth gated app later needs
# no change here. Also covers any pre-existing Host rule under this domain
# that already pointed at Traefik but had nothing answering DNS for it.
address=/HOMELAB_DOMAIN_PLACEHOLDER/TRAEFIK_TARGET_PLACEHOLDER

# A household's worth of clients needs no special cache tuning; the default
# is fine, set explicitly so it doesn't silently change with the image.
cache-size=1000

# On while this is new — confirms which devices actually picked it up as
# their resolver, and shows every lookup under the shared domain being
# answered correctly. Worth turning off (drop this line) once the DHCP
# override is confirmed working across the household's devices.
log-queries=extra
